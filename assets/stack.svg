<svg xmlns="http://www.w3.org/2000/svg" width="860" height="180" viewBox="0 0 860 180" role="img">
  <title>ahmd4vd - toolkit</title>
  <defs>
    <linearGradient id="topline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0" />
      <stop offset="0.5" stop-color="#58a6ff" stop-opacity="0.85" />
      <stop offset="1" stop-color="#79c0ff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.09" />
      <stop offset="0.55" stop-color="#0d1117" stop-opacity="0" />
      <stop offset="1" stop-color="#79c0ff" stop-opacity="0.04" />
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600&amp;family=Plus+Jakarta+Sans:wght@700&amp;display=swap');
      .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace; }
      .sans { font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif; }
    </style>
  </defs>

  <rect width="860" height="180" rx="16" fill="#0d1117" />
  <rect width="860" height="180" rx="16" fill="url(#wash)" />
  <rect x="1" y="1" width="858" height="178" rx="15" fill="none" stroke="#21262d" />
  <rect x="28" y="1" width="804" height="1" fill="url(#topline)" />

  <!-- Header -->
  <text x="28" y="31" class="mono" font-size="10" font-weight="600" letter-spacing="0.16em" fill="#8b949e">TOOLS I USE</text>
  <text x="28" y="55" class="sans" font-size="16" font-weight="700" fill="#c9d1d9">A small, practical stack for building and shipping.</text>
  <text x="832" y="31" text-anchor="end" class="mono" font-size="9" font-weight="600" letter-spacing="0.12em" fill="#484f58">AHMD4VD / 01</text>

  <!-- Dividers -->
  <line x1="286" y1="80" x2="286" y2="154" stroke="#21262d" />
  <line x1="572" y1="80" x2="572" y2="154" stroke="#21262d" />

  <!-- Core -->
  <g transform="translate(28,80)">
    <text class="mono" font-size="9" font-weight="600" letter-spacing="0.14em" fill="#58a6ff">01 / CORE</text>
    <line x1="0" y1="14" x2="230" y2="14" stroke="#21262d" />
    <circle cx="4" cy="36" r="3" fill="#58a6ff" />
    <text x="16" y="40" class="mono" font-size="11" font-weight="600" fill="#c9d1d9">Go</text>
    <circle cx="124" cy="36" r="3" fill="#f2cc60" />
    <text x="136" y="40" class="mono" font-size="11" font-weight="600" fill="#c9d1d9">Python</text>
    <circle cx="4" cy="62" r="3" fill="#3178c6" />
    <text x="16" y="66" class="mono" font-size="11" font-weight="600" fill="#c9d1d9">TypeScript</text>
    <circle cx="124" cy="62" r="3" fill="#7f52ff" />
    <text x="136" y="66" class="mono" font-size="11" font-weight="600" fill="#c9d1d9">Kotlin</text>
  </g>

  <!-- Build -->
  <g transform="translate(314,80)">
    <text class="mono" font-size="9" font-weight="600" letter-spacing="0.14em" fill="#58a6ff">02 / BUILD</text>
    <line x1="0" y1="14" x2="230" y2="14" stroke="#21262d" />
    <circle cx="4" cy="36" r="3" fill="#61dafb" />
    <text x="16" y="40" class="mono" font-size="11" font-weight="600" fill="#c9d1d9">React</text>
    <circle cx="124" cy="36" r="3" fill="#c9d1d9" />
    <text x="136" y="40" class="mono" font-size="11" font-weight="600" fill="#c9d1d9">Next.js</text>
    <circle cx="4" cy="62" r="3" fill="#58a6ff" />
    <text x="16" y="66" class="mono" font-size="11" font-weight="600" fill="#c9d1d9">Compose</text>
    <circle cx="124" cy="62" r="3" fill="#38bdf8" />
    <text x="136" y="66" class="mono" font-size="11" font-weight="600" fill="#c9d1d9">Tailwind</text>
  </g>

  <!-- Ship -->
  <g transform="translate(600,80)">
    <text class="mono" font-size="9" font-weight="600" letter-spacing="0.14em" fill="#58a6ff">03 / SHIP</text>
    <line x1="0" y1="14" x2="230" y2="14" stroke="#21262d" />
    <circle cx="4" cy="36" r="3" fill="#336791" />
    <text x="16" y="40" class="mono" font-size="11" font-weight="600" fill="#c9d1d9">PostgreSQL</text>
    <circle cx="124" cy="36" r="3" fill="#47a248" />
    <text x="136" y="40" class="mono" font-size="11" font-weight="600" fill="#c9d1d9">MongoDB</text>
    <circle cx="4" cy="62" r="3" fill="#2496ed" />
    <text x="16" y="66" class="mono" font-size="11" font-weight="600" fill="#c9d1d9">Docker</text>
    <circle cx="124" cy="62" r="3" fill="#8cc84b" />
    <text x="136" y="66" class="mono" font-size="11" font-weight="600" fill="#c9d1d9">Node.js</text>
  </g>
</svg>
