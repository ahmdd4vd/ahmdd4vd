<svg xmlns="http://www.w3.org/2000/svg" width="860" height="138" viewBox="0 0 860 138" role="img">
  <title>Security and lessons</title>
  <defs>
    <linearGradient id="topline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0" />
      <stop offset="0.48" stop-color="#58a6ff" stop-opacity="0.85" />
      <stop offset="1" stop-color="#79c0ff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.09" />
      <stop offset="0.6" stop-color="#0d1117" stop-opacity="0" />
      <stop offset="1" stop-color="#79c0ff" stop-opacity="0.04" />
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap');
      .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace; }
      .sans { font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif; }
    </style>
  </defs>

  <rect width="860" height="138" rx="16" fill="#0d1117" />
  <rect width="860" height="138" rx="16" fill="url(#wash)" />
  <rect x="1" y="1" width="858" height="136" rx="15" fill="none" stroke="#21262d" />
  <rect x="28" y="1" width="804" height="1" fill="url(#topline)" />

  <text x="28" y="31" class="mono" font-size="10" font-weight="600" letter-spacing="0.16em" fill="#8b949e">SECURITY NOTES / 01</text>
  <text x="28" y="69" class="sans" font-size="25" font-weight="800" letter-spacing="-0.03em" fill="#c9d1d9">Security, with boundaries.</text>
  <text x="832" y="31" text-anchor="end" class="mono" font-size="9" font-weight="600" letter-spacing="0.12em" fill="#484f58">DISCLOSE / REFLECT / BUILD</text>

  <line x1="28" y1="94" x2="832" y2="94" stroke="#21262d" />
  <circle cx="32" cy="116" r="3" fill="#58a6ff" />
  <text x="44" y="120" class="mono" font-size="10" font-weight="600" letter-spacing="0.08em" fill="#8b949e">RESPONSIBLE DISCLOSURE</text>
  <circle cx="285" cy="116" r="3" fill="#79c0ff" />
  <text x="297" y="120" class="mono" font-size="10" font-weight="600" letter-spacing="0.08em" fill="#8b949e">HARD LESSONS</text>
  <circle cx="478" cy="116" r="3" fill="#c9d1d9" />
  <text x="490" y="120" class="mono" font-size="10" font-weight="600" letter-spacing="0.08em" fill="#8b949e">BETTER SYSTEMS</text>
</svg>
